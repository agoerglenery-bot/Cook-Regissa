<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cook Regissa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>HAVE YOU COOKED REGISSA TODAY?</h1>

  <div class="counter">COOKED: <span id="counter" aria-live="polite">0</span></div>

  <div class="cooking-area">
    <div id="pan">
      <div class="pan-body"></div>
      <div class="pan-handle"></div>
    </div>
    <img id="regissa" src="regissa.png" alt="Regissa">
  </div>

  <button id="cookButton" type="button">COOK</button>

  <!-- script at the END of body, or add defer in <head> -->
  <script src="script.js"></script>
</body>
</html>
